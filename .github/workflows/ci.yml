name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://test:test@localhost:5432/school_test?schema=public"
  DIRECT_URL: "postgresql://test:test@localhost:5432/school_test?schema=public"
  JWT_ACCESS_SECRET: "ci-test-access-secret-32chars-long"
  JWT_REFRESH_SECRET: "ci-test-refresh-secret-32chars-long"
  FRONTEND_URL: "http://localhost:3000"

jobs:
  # ─── Backend Lint & Test ────────────────────────────────────────────────────
  backend:
    name: Backend (Lint + Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: school_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Type check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: ./backend
        run: npm run test:unit -- --coverage
        env:
          NODE_ENV: test

      - name: Run integration tests
        working-directory: ./backend
        run: npm run test:integration
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

      - name: Build backend
        working-directory: ./backend
        run: npm run build

  # ─── Frontend Lint & Build ──────────────────────────────────────────────────
  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.school.example.com/api/v1
          NEXT_PUBLIC_APP_NAME: School Management System

  # ─── E2E Tests ──────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: school_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Setup database
        working-directory: ./backend
        run: |
          npx prisma migrate deploy
          npx prisma db seed
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/school_e2e?schema=public"
          DIRECT_URL: "postgresql://test:test@localhost:5432/school_e2e?schema=public"

      - name: Start backend
        working-directory: ./backend
        run: npm run dev &
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://test:test@localhost:5432/school_e2e?schema=public"
          DIRECT_URL: "postgresql://test:test@localhost:5432/school_e2e?schema=public"
          PORT: 5000

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/health --timeout 30000

      - name: Start frontend
        working-directory: ./frontend
        run: npm run dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Install Playwright browsers
        working-directory: ./backend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./backend
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: backend/playwright-report/
          retention-days: 7

  # ─── Security Scan ──────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (backend)
        working-directory: ./backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: "school-management"
          path: "."
          format: "HTML"
          args: >-
            --enableRetired
            --failOnCVSS 9
        continue-on-error: true

      - name: Upload OWASP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: reports/
