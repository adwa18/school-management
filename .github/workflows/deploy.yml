name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Pre-deploy checks ──────────────────────────────────────────────────────
  pre-deploy:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - uses: actions/checkout@v4

      - name: Check CI status
        id: check
        run: echo "should_deploy=true" >> $GITHUB_OUTPUT

  # ─── Deploy Backend → Render ─────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: needs.pre-deploy.outputs.should_deploy == 'true'
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build
        working-directory: ./backend
        run: npm run build

      - name: Run DB migrations (production)
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Trigger Render Deploy
        # Render auto-deploys on push to main via GitHub integration.
        # Alternatively use the Render deploy hook:
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}" | jq .
          else
            echo "No Render deploy hook configured — using GitHub integration"
          fi

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be healthy..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.BACKEND_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "❌ Backend health check failed"
          exit 1

  # ─── Deploy Frontend → Vercel ────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.BACKEND_URL }}/api/v1
          NEXT_PUBLIC_APP_NAME: School Management System

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

  # ─── Post-Deploy Smoke Test ──────────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Test backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.BACKEND_URL }}/health")
          [ "$STATUS" = "200" ] && echo "✅ Backend healthy" || (echo "❌ Backend unhealthy: $STATUS" && exit 1)

      - name: Test frontend loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.FRONTEND_URL }}")
          [ "$STATUS" = "200" ] && echo "✅ Frontend reachable" || (echo "❌ Frontend down: $STATUS" && exit 1)

      - name: Test auth endpoint
        run: |
          RESPONSE=$(curl -s -X POST "${{ vars.BACKEND_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@school.edu","password":"Admin@123"}')
          echo "$RESPONSE" | grep -q "accessToken" && echo "✅ Auth working" || (echo "❌ Auth failed: $RESPONSE" && exit 1)

  # ─── Notify deployment ───────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-frontend, smoke-test]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          if [ "${{ needs.smoke-test.result }}" = "success" ]; then
            echo "🎉 Deployment successful!"
            echo "Frontend: ${{ vars.FRONTEND_URL }}"
            echo "Backend:  ${{ vars.BACKEND_URL }}"
          else
            echo "❌ Deployment failed or smoke tests failed"
            exit 1
          fi
